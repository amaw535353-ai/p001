[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p005-threat-modeling"
version = "1.0.0"
description = "Offline synthetic AI threat modeling and trust boundary analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "hypothesis==6.151.9", "ruff==0.15.6", "mypy==1.19.1"]

[project.scripts]
p005 = "p005.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p005 = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S102", "S307"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
