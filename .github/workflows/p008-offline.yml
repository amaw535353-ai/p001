name: P008 offline dataset and evaluation checks
on:
  push:
    paths: ['p-008/**', '.github/workflows/p008-offline.yml']
  pull_request:
    paths: ['p-008/**', '.github/workflows/p008-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/setup
        working-directory: p-008
      - run: make verify test-offline
        working-directory: p-008
      - run: PYTHONPATH=src/p008/adapters/offline_guard ./scripts/p008 demo
        working-directory: p-008
      - run: make unit static
