name: P009 offline telemetry and evidence checks
on:
  push:
    paths: ['p-009/**', '.github/workflows/p009-offline.yml']
  pull_request:
    paths: ['p-009/**', '.github/workflows/p009-offline.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/setup
        working-directory: p-009
      - run: make verify
        working-directory: p-009
      - run: PYTHONPATH=tests/no-network:src ./scripts/p009 demo
        working-directory: p-009
      - run: make unit static
