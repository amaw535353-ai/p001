[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p002-synthetic-enterprise"
version = "1.0.0"
description = "Offline synthetic enterprise graph and scenario factory"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5"]

[project.scripts]
p002 = "p002.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S102", "S307"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
