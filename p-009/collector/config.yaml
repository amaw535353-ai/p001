extensions:
  basicauth/producer:
    htpasswd:
      inline: ${env:P009_OTLP_HTPASSWD}
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 65536
        auth:
          authenticator: basicauth/producer
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/source:
    error_mode: propagate
    trace_conditions:
      - resource.attributes["service.name"] != "p009-synthetic"
    metric_conditions:
      - resource.attributes["service.name"] != "p009-synthetic"
    log_conditions:
      - resource.attributes["service.name"] != "p009-synthetic"
  resource/identity:
    attributes:
      - {key: p009.source, value: otel-a, action: upsert}
      - {key: p009.tenant, value: tenant-a, action: upsert}
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "p009.source", "p009.tenant"])
      - context: span
        statements:
          - keep_keys(attributes, ["p009.event_type", "p009.request_id", "p009.tool_call_id", "p009.authorization_decision_id", "p009.model_ref", "p009.decision"])
          - set(name, "p009.synthetic")
          - set(status.message, "")
      - context: spanevent
        statements:
          - set(name, "p009.metadata")
          - keep_keys(attributes, [])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "p009.source", "p009.tenant"])
      - context: log
        statements:
          - set(body, "metadata-only")
          - keep_keys(attributes, ["p009.event_id", "p009.event_type", "p009.signal", "p009.decision", "p009.request_id"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "p009.source", "p009.tenant"])
      - context: metric
        statements:
          - set(name, "p009.synthetic.count")
          - set(description, "")
      - context: datapoint
        statements:
          - keep_keys(attributes, [])
  batch:
    send_batch_size: 16
    send_batch_max_size: 32
    timeout: 1s
  filter/security:
    error_mode: propagate
    log_conditions:
      - 'log.attributes["p009.event_type"] != "security"'
  filter/audit:
    error_mode: propagate
    log_conditions:
      - 'log.attributes["p009.event_type"] == "security"'
exporters:
  otlp_http/archive:
    endpoint: http://archive:8090
    encoding: json
    compression: none
    headers:
      Authorization: Bearer ${env:P009_COLLECTOR_TOKEN}
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 64
      num_consumers: 1
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s
service:
  extensions: [basicauth/producer, health_check]
  telemetry:
    logs: {level: error}
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/source, resource/identity, transform/privacy, batch]
      exporters: [otlp_http/archive]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/source, resource/identity, transform/privacy, batch]
      exporters: [otlp_http/archive]
    logs/audit:
      receivers: [otlp]
      processors: [memory_limiter, filter/source, filter/audit, resource/identity, transform/privacy, batch]
      exporters: [otlp_http/archive]
    logs/security:
      receivers: [otlp]
      processors: [memory_limiter, filter/source, filter/security, resource/identity, transform/privacy, batch]
      exporters: [otlp_http/archive]
