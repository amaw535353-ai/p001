[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p008-evaluation-pipeline"
version = "1.0.0"
description = "Local AI security evaluation datasets and regression testing pipeline"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.12.5", "jsonschema==4.26.0", "PyYAML==6.0.3"]

[project.scripts]
p008 = "p008.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p008 = ["adapters/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = ["live: executes installed optional evaluation tools"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S102", "S307"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests", ".tools", ".venv"]
